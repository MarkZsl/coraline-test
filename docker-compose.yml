version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: coraline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DataEngineer_2024}
      POSTGRES_DB: ${POSTGRES_DB:-challenge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-challenge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: coraline_airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-DataEngineer_2024}@postgres:5432/airflow_meta
      PYTHONPATH: /opt/airflow/project
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-challenge}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DataEngineer_2024}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./sql:/opt/airflow/project/sql
      - ./config:/opt/airflow/project/config
      - ./data:/opt/airflow/project/data
      - airflow_home:/opt/airflow
    working_dir: /opt/airflow/project
    command: bash -c "pip install --quiet pandas SQLAlchemy psycopg2-binary openpyxl PyYAML python-dotenv && airflow standalone"

volumes:
  postgres_data:
  airflow_home:
